<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>邮件草稿</title><style>body{font:16px system-ui;margin:24px;background:#f5f6f8;color:#17202a}button,input,textarea,select{font:inherit;padding:9px;box-sizing:border-box}input,textarea,select{width:100%;margin:6px 0 14px}textarea{min-height:250px}button{margin:5px 8px 5px 0}#notice{white-space:pre-wrap;padding:12px;background:#e8edf5}label{display:block}#attachments div{overflow-wrap:anywhere;margin-bottom:8px}#send{background:#235aa6;color:white;border:0;border-radius:5px}</style></head><body><h1>邮件草稿</h1><p>草稿保存在本机，发送结果以状态和回执为准。核对内容后，还需在最终确认窗口点击“确认发送”。</p><div id="notice" role="status"></div><button id="refresh">刷新草稿</button><button id="connect">授权 Gmail 发送</button><button id="new">新建草稿</button><select id="drafts" aria-label="选择草稿"></select><label>收件人（多个地址用逗号分隔）<input id="to" autocomplete="off"></label><label>抄送（逗号分隔）<input id="cc" autocomplete="off"></label><label>密送（逗号分隔）<input id="bcc" autocomplete="off"></label><section><h2>附件</h2><p>发送草稿保存的文件快照。最多 10 个，总计 18 MiB；查看会在文件夹中定位快照。</p><div id="attachments"></div><button id="add-attachment">选择附件</button></section><label>主题<input id="subject" maxlength="200"></label><label>正文（纯文本）<textarea id="body" maxlength="20000"></textarea></label><button id="save">保存修改</button><button id="send">预览并确认发送</button><script src="./mail-review-renderer.js"></script></body></html>
